groups:
  - name: backup_alerts
    rules:
      # Covers the run that never happens (stopped cron), which the ERR trap
      # cannot see. Hourly backup, so 2h allows one missed run.
      - alert: VaultwardenBackupStale
        expr: time() - vaultwarden_backup_last_success_timestamp_seconds > 7200
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Vaultwarden backup is stale"
          description: "No Vaultwarden backup has reached S3 for {{ $value | humanizeDuration }}\n  Check /var/log/backup-vaultwarden.log and the hourly cron."

      - alert: VaultwardenBackupFailing
        expr: vaultwarden_backup_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Vaultwarden backup failed"
          description: "The last Vaultwarden backup run exited non-zero\n  Check /var/log/backup-vaultwarden.log."

      # Absent means node_exporter is down or the .prom was removed -- either way
      # the two alerts above are blind.
      - alert: VaultwardenBackupMetricMissing
        expr: absent(vaultwarden_backup_last_success_timestamp_seconds)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Vaultwarden backup metric missing"
          description: "vaultwarden_backup_last_success_timestamp_seconds is not being reported; backup staleness alerting is blind until it returns."

      # Every 6h at :15; 18h allows two missed runs, which rides out the 03:00
      # reboot and a single transient failure without going quiet for a day.
      - alert: PhotosBackupStale
        expr: time() - photos_backup_last_success_timestamp_seconds > 64800
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Photo backup is stale"
          description: "No verified photo snapshot for {{ $value | humanizeDuration }}\n  Check /var/log/backup-photos.log and the 6-hourly cron at :15."

      # Set by the ERR trap and by every guard. All of them refuse rotation, so
      # existing backups survive the failure.
      - alert: PhotosBackupFailing
        expr: photos_backup_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Photo backup failed"
          description: "The last photo backup run did not produce a verified snapshot\n  Check /var/log/backup-photos.log."

      - alert: PhotosBackupMetricMissing
        expr: absent(photos_backup_last_success_timestamp_seconds)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Photo backup metric missing"
          description: "photos_backup_last_success_timestamp_seconds is not being reported; photo backup staleness alerting is blind until it returns. Expected after the first run of backup-photos.sh."

      - alert: PrivateBackupStale
        expr: time() - private_backup_last_success_timestamp_seconds > 64800
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Private backup is stale"
          description: "No verified private snapshot for {{ $value | humanizeDuration }}\n  Check /var/log/backup-private.log and the 6-hourly cron at :45."

      - alert: PrivateBackupFailing
        expr: private_backup_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Private backup failed"
          description: "The last private backup run did not produce a verified snapshot\n  Check /var/log/backup-private.log."

      - alert: PrivateBackupMetricMissing
        expr: absent(private_backup_last_success_timestamp_seconds)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Private backup metric missing"
          description: "private_backup_last_success_timestamp_seconds is not being reported; private backup staleness alerting is blind until it returns. Expected after the first run of backup-private.sh."
