groups:
  - name: disk_alerts
    rules:
      - alert: DiskMissing
        expr: disk_present == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.label }} is not attached"
          description: "{{ $labels.label }} ({{ $labels.serial }}) has disappeared from the system\n  Check the USB cable/port and `journalctl -k | grep -i usb`."

      # Growth, not non-zero: the WD already has 3 pending sectors.
      - alert: DiskBadSectorsIncreasing
        expr: delta(disk_ata_attribute_raw{attribute=~"reallocated_sector_ct|current_pending_sector|offline_uncorrectable|reported_uncorrect"}[6h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.label }}: {{ $labels.attribute }} increased"
          description: "{{ $labels.attribute }} on {{ $labels.label }} ({{ $labels.serial }}) went up in the last 6h\n  New bad sectors: check `sudo smartctl -A` and plan a replacement."

      - alert: DiskLinkErrorsIncreasing
        expr: delta(disk_ata_attribute_raw{attribute="udma_crc_error_count"}[6h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.label }}: interface CRC errors increased"
          description: "CRC errors on {{ $labels.label }} point to the cable, USB port or enclosure, not the platters."

      - alert: DiskSmartFailed
        expr: disk_smart_passed == 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.label }} reports SMART health FAILED"
          description: "The drive itself predicts failure. Copy anything not backed up off {{ $labels.label }} now."

      - alert: DiskSelfTestFailed
        expr: delta(disk_selftest_errors[1d]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.label }}: a SMART self-test failed"
          description: "Check `sudo smartctl -l selftest` on {{ $labels.label }} for the failing LBA."

      - alert: NvmeCriticalWarning
        expr: disk_nvme_critical_warning > 0 or disk_nvme_percentage_used > 90 or disk_nvme_available_spare < 10
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.label }}: NVMe health warning"
          description: "critical_warning set, endurance above 90% or spare below 10% on the system disk."

      - alert: DiskTemperatureHigh
        expr: disk_temperature_celsius > 55
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.label }} is running hot"
          description: "{{ $labels.label }} has been above 55°C for 30m ({{ $value }}°C)."

      - alert: DiskHealthMetricsStale
        expr: time() - disk_health_last_run_timestamp_seconds > 3600 or absent(disk_health_last_run_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Disk health metrics are stale"
          description: "disk-health.py has not reported for over an hour; disk alerting is blind\n  Check `journalctl -t disk-health` and its cron."
